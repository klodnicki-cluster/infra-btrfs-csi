driver:
  # Renovate follows published builds of the fork's latest image by digest.
  image: ghcr.io/klodzack/btrfs-csi-driver:latest@sha256:355a1bf4c20e31a340206ed44b26c903e5b9013a4142fe21cfb261638e8e5cfb
  poolsHostPath: /var/mnt

storageClasses:
  - name: hot-retain-cow
    pool: storage-hot
    reclaimPolicy: Retain
    cow: true
  - name: hot-retain-inplace
    pool: storage-hot
    reclaimPolicy: Retain
    cow: false
  - name: hot-delete-cow
    pool: storage-hot
    reclaimPolicy: Delete
    cow: true
  - name: hot-delete-inplace
    pool: storage-hot
    reclaimPolicy: Delete
    cow: false
  - name: archive-retain-cow
    pool: storage-archive
    reclaimPolicy: Retain
    cow: true
  - name: archive-retain-inplace
    pool: storage-archive
    reclaimPolicy: Retain
    cow: false
  - name: archive-delete-cow
    pool: storage-archive
    reclaimPolicy: Delete
    cow: true
  - name: archive-delete-inplace
    pool: storage-archive
    reclaimPolicy: Delete
    cow: false
