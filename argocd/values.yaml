driver:
  # Fork build from commit 435fc315082d45c97e258ed06c4974364752da7e.
  image: ghcr.io/klodzack/btrfs-csi-driver:latest@sha256:71d0a235cfa47220730d91c1a957f5d85ee4b3f29122a28e185a34ed8afc1e03
  poolsHostPath: /var/mnt

storageClasses:
  - name: hot-retain-cow
    pool: storage-hot
    reclaimPolicy: Retain
    cow: true
  - name: hot-retain-inplace
    pool: storage-hot
    reclaimPolicy: Retain
    cow: false
  - name: hot-delete-cow
    pool: storage-hot
    reclaimPolicy: Delete
    cow: true
  - name: hot-delete-inplace
    pool: storage-hot
    reclaimPolicy: Delete
    cow: false
  - name: archive-retain-cow
    pool: storage-archive
    reclaimPolicy: Retain
    cow: true
  - name: archive-retain-inplace
    pool: storage-archive
    reclaimPolicy: Retain
    cow: false
  - name: archive-delete-cow
    pool: storage-archive
    reclaimPolicy: Delete
    cow: true
  - name: archive-delete-inplace
    pool: storage-archive
    reclaimPolicy: Delete
    cow: false
