driver:
  # Renovate follows published builds of the fork's latest image by digest.
  image: ghcr.io/klodzack/btrfs-csi-driver:latest@sha256:355a1bf4c20e31a340206ed44b26c903e5b9013a4142fe21cfb261638e8e5cfb
  poolsHostPath: /var/mnt

storageClasses:
  - name: hot-retain
    pool: storage-hot
    reclaimPolicy: Retain
    cow: true
    compression: zstd
  - name: hot-delete
    default: true
    pool: storage-hot
    reclaimPolicy: Delete
    cow: true
    compression: zstd
  - name: archive-retain
    pool: storage-archive
    reclaimPolicy: Retain
    cow: true
    compression: zstd
  - name: archive-delete
    pool: storage-archive
    reclaimPolicy: Delete
    cow: true
    compression: zstd
